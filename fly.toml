# Fly.io — https://fly.io/docs/reference/configuration/
# First deploy: `fly launch` (creates app + syncs region), then `fly deploy`.
# Set app name to match your Fly app: `fly apps list` or change `app` below.

app = "portfolio"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
