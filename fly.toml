# fly.toml — https://fly.io/docs/reference/configuration/
#
# Fix: do not set both `memory` and `memory_mb` (they conflict). Fly may reject the file or
# provision an inconsistent machine size, which breaks deploys / causes crash loops.

app = "portfolio-muo0dg"
primary_region = "dfw"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "25s"
  method = "GET"
  path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
